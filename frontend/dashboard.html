<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="description" content="Monitor and manage your isolated AWS EC2 deployments securely.">
  <title>Dashboard | AutoDevOps</title>
  <link rel="stylesheet" href="/static/style.css?v=9">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%238b5cf6'/><text x='50%25' y='55%25' font-size='18' text-anchor='middle' dominant-baseline='middle' fill='white'>⚡</text></svg>">
  <script src="/static/auth.js"></script>
  <script>
    function getStoredTheme() {
      var saved = localStorage.getItem('adops-theme');
      return saved || 'dark';
    }
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('adops-theme', theme);
      var btn = document.getElementById('theme_toggle_btn');
      if (btn) btn.textContent = (theme === 'light' ? '🌙' : '☀️');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f5f6fa' : '#0b0d0f');
    }
    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme') || 'dark';
      var next = (current === 'dark' ? 'light' : 'dark');
      applyTheme(next);
    }
    document.documentElement.setAttribute('data-theme', getStoredTheme());
    document.addEventListener('DOMContentLoaded', function() {
      applyTheme(getStoredTheme());
    });
  </script>
</head>
<body>
  <div class="glow-blob glow-blob-1"></div>
  <div class="glow-blob glow-blob-2"></div>
  <div class="glow-blob glow-blob-3"></div>
  <div class="glow-blob glow-blob-4"></div>

  <div class="page-wrapper">
    <!-- Nav -->
    <nav class="nav">
      <a class="nav-logo" href="/">
        <div class="nav-logo-icon">⚡</div>
        <span class="nav-logo-text">AutoDevOps</span>
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme_toggle_btn" onclick="toggleTheme()" title="Toggle light/dark mode" aria-label="Toggle theme">☀️</button>
        <button class="btn btn-ghost btn-sm" onclick="loadApps()" id="refresh_btn">↺ Refresh</button>
        <a class="btn btn-primary btn-sm" href="/">+ New Deploy</a>
      </div>
    </nav>

    <!-- Dashboard content -->
    <div class="container-wide">

      <!-- Header -->
      <div class="dashboard-header">
        <h1>Your Deployments</h1>
        <p>Isolated virtual machines deployed to your AWS account. Terminate instances when done to prevent unnecessary cloud costs.</p>
      </div>

      <!-- Toolbar -->
      <div class="dashboard-toolbar">
        <div class="dashboard-count">
          <span id="app_count_label">Loading your deployments…</span>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <div id="creds_warning" style="display:none;">
            <span style="font-size:0.8rem;color:var(--amber);">⚠️ AWS Vault key not configured</span>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="openVaultModal()" id="creds_btn" title="Manage encrypted AWS credentials">🛡️ AWS Vault</button>
        </div>
      </div>

      <!-- Apps grid -->
      <div class="apps-grid" id="apps_grid">
        <!-- skeleton placeholders -->
        <div class="app-card" style="gap:12px;">
          <div class="skeleton" style="height:18px;width:60%;border-radius:6px;"></div>
          <div class="skeleton" style="height:14px;width:40%;border-radius:6px;"></div>
          <div class="skeleton" style="height:38px;border-radius:10px;"></div>
          <div class="skeleton" style="height:36px;border-radius:10px;"></div>
        </div>
        <div class="app-card" style="gap:12px;">
          <div class="skeleton" style="height:18px;width:70%;border-radius:6px;"></div>
          <div class="skeleton" style="height:14px;width:35%;border-radius:6px;"></div>
          <div class="skeleton" style="height:38px;border-radius:10px;"></div>
          <div class="skeleton" style="height:36px;border-radius:10px;"></div>
        </div>
        <div class="app-card" style="gap:12px;">
          <div class="skeleton" style="height:18px;width:50%;border-radius:6px;"></div>
          <div class="skeleton" style="height:14px;width:45%;border-radius:6px;"></div>
          <div class="skeleton" style="height:38px;border-radius:10px;"></div>
          <div class="skeleton" style="height:36px;border-radius:10px;"></div>
        </div>
      </div>

    </div><!-- /container-wide -->

    <footer class="footer">
      AutoDevOps &middot; <a href="/">Deploy a new app</a>
    </footer>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast_container"></div>

  <script>
    // ── Toast ──────────────────────────────────────────────────────
    function showToast(msg, type = "info") {
      const container = document.getElementById("toast_container");
      const t = document.createElement("div");
      const icons = { success: "✅", error: "❌", info: "💬" };
      t.className = `toast toast-${type}`;
      t.innerHTML = `<span>${icons[type] || "💬"}</span><span>${msg}</span>`;
      container.appendChild(t);
      setTimeout(() => {
        t.classList.add("fadeout");
        setTimeout(() => t.remove(), 300);
      }, 3500);
    }

    // ── Check Vault Status for Toolbar ─────────────────────────────
    async function updateVaultToolbar() {
      const v = await getVaultStatus();
      const warningEl = document.getElementById("creds_warning");
      const credsBtn = document.getElementById("creds_btn");
      if (v && v.configured && v.masked_key) {
        if (warningEl) warningEl.style.display = "none";
        if (credsBtn) credsBtn.innerHTML = `🛡️ Vault Active (${escHtml(v.masked_key)})`;
      } else {
        if (warningEl) warningEl.style.display = "block";
        if (credsBtn) credsBtn.innerHTML = `🔑 Configure Vault`;
      }
    }

    // ── Load User Apps (Strictly Multi-Tenant) ─────────────────────
    async function loadApps() {
      const grid = document.getElementById("apps_grid");
      const btn  = document.getElementById("refresh_btn");
      btn.disabled = true;
      btn.textContent = "↺ Loading…";

      try {
        const res  = await fetchWithAuth("/apps");
        if (!res.ok) throw new Error("Server error " + res.status);
        const data = await res.json();
        const apps = data.apps || [];

        const countLabel = document.getElementById("app_count_label");
        const running = apps.filter(a => String(a[3] || "").toUpperCase() !== "DELETED").length;

        if (apps.length === 0) {
          countLabel.innerHTML = "No deployments yet";
          grid.innerHTML = `
            <div class="empty-state-workspace" style="grid-column:1/-1;">
              <div class="empty-hero">
                <div class="empty-hero-badge"><span class="hero-badge-dot"></span> Ready to Deploy</div>
                <h2 class="empty-hero-title">Launch Your First Cloud Service</h2>
                <p class="empty-hero-sub">AutoDevOps provisions your EC2 instance, configures Security Groups with Port 80 ingress, and serves your live container in minutes.</p>
              </div>

              <div class="empty-starter-grid">
                <a href="/#deploy" onclick="localStorage.setItem('preset_deploy','fastapi')" class="starter-card">
                  <div class="starter-card-icon" style="background:rgba(139,92,246,0.18);border:1px solid rgba(139,92,246,0.35);">⚡</div>
                  <div class="starter-card-body">
                    <div class="starter-card-title">FastAPI Python 3.11</div>
                    <div class="starter-card-desc">High performance ASGI REST API with auto requirements.txt install.</div>
                    <span class="starter-card-cta">Deploy Template &rarr;</span>
                  </div>
                </a>

                <a href="/#deploy" onclick="localStorage.setItem('preset_deploy','express')" class="starter-card">
                  <div class="starter-card-icon" style="background:rgba(6,182,212,0.18);border:1px solid rgba(6,182,212,0.35);">🟢</div>
                  <div class="starter-card-body">
                    <div class="starter-card-title">Express.js Node 20</div>
                    <div class="starter-card-desc">Clean Node runtime with automatic package.json caching and port 80 routing.</div>
                    <span class="starter-card-cta">Deploy Template &rarr;</span>
                  </div>
                </a>

                <a href="/#deploy" class="starter-card">
                  <div class="starter-card-icon" style="background:rgba(16,185,129,0.18);border:1px solid rgba(16,185,129,0.35);">🐙</div>
                  <div class="starter-card-body">
                    <div class="starter-card-title">Custom GitHub Repo</div>
                    <div class="starter-card-desc">Paste any public repository URL and launch with your custom environment.</div>
                    <span class="starter-card-cta">Connect Repository &rarr;</span>
                  </div>
                </a>
              </div>

              <div class="infra-highlights-bar">
                <div class="infra-pill"><span class="infra-dot" style="background:var(--green);"></span> Free-Tier t3.micro Ready</div>
                <div class="infra-pill"><span class="infra-dot" style="background:var(--purple);"></span> AES-256 Vault Encryption</div>
                <div class="infra-pill"><span class="infra-dot" style="background:var(--blue);"></span> Automatic Port 80 Ingress</div>
                <div class="infra-pill"><span class="infra-dot" style="background:var(--amber);"></span> GitHub Push Webhook Ready</div>
              </div>
            </div>`;
          return;
        }

        countLabel.innerHTML = `<span class="dashboard-count-num">${apps.length}</span> total &nbsp;·&nbsp; <span class="dashboard-count-num" style="color:var(--green);">${running}</span> running`;

        grid.innerHTML = apps.map((app, i) => {
          const [appId, repo, url, status, instanceId, createdAt, appType] = app;
          const isDeleted  = String(status || "").toUpperCase() === "DELETED";
          const canTerminate = instanceId && String(instanceId).startsWith("i-") && !isDeleted;
          const statusClass = isDeleted ? "status-deleted" : "status-running";
          const statusLabel = String(status || "UNKNOWN").toUpperCase();
          const runtimeName = String(appType || "python").toUpperCase();

          const urlSection = url
            ? `<div class="app-card-url">
                <span class="app-card-url-icon">🔗</span>
                <a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>
               </div>`
            : `<div class="app-card-url">
                <span class="app-card-url-icon">🔗</span>
                <span class="app-card-url-empty">No URL yet</span>
               </div>`;

          return `
          <div class="app-card" style="animation-delay:${i * 60}ms">
            <div class="app-card-top">
              <div class="app-card-info">
                <div class="app-card-repo">${escHtml(repo)}</div>
                <div style="display:flex;align-items:center;gap:6px;margin-top:3px;">
                  <span class="app-card-id">${escHtml(appId)}</span>
                  <span class="badge badge-purple" style="font-size:0.68rem;padding:1px 6px;letter-spacing:0.03em;">${escHtml(runtimeName)}</span>
                </div>
              </div>
              <span class="status-badge ${statusClass}">
                <span class="status-badge-dot"></span>
                ${statusLabel}
              </span>
            </div>
            ${urlSection}
            ${instanceId ? `<div style="font-size:0.72rem;color:var(--ink-3);font-family:'JetBrains Mono',monospace;">Instance: ${escHtml(instanceId)}</div>` : ""}
            ${canTerminate ? `
            <div class="metrics-panel" id="metrics_panel_${escHtml(instanceId)}">
              <div class="metrics-grid">
                <div class="metric-item">
                  <div class="metric-head">
                    <span class="metric-name">CPU</span>
                    <span class="metric-val" id="cpu_val_${escHtml(instanceId)}">--%</span>
                  </div>
                  <div class="metric-chart" id="cpu_chart_${escHtml(instanceId)}">
                    <div style="font-size:0.68rem;color:var(--ink-3);">Loading...</div>
                  </div>
                </div>
                <div class="metric-item">
                  <div class="metric-head">
                    <span class="metric-name">RAM</span>
                    <span class="metric-val" id="ram_val_${escHtml(instanceId)}">--%</span>
                  </div>
                  <div class="metric-chart" id="ram_chart_${escHtml(instanceId)}">
                    <div style="font-size:0.68rem;color:var(--ink-3);">Loading...</div>
                  </div>
                </div>
                <div class="metric-item">
                  <div class="metric-head">
                    <span class="metric-name">NET</span>
                    <span class="metric-val" id="net_val_${escHtml(instanceId)}">-- KB/s</span>
                  </div>
                  <div class="metric-chart" id="net_chart_${escHtml(instanceId)}">
                    <div style="font-size:0.68rem;color:var(--ink-3);">Loading...</div>
                  </div>
                </div>
              </div>
              <div class="metric-status-row">
                <span class="metric-health-badge" id="health_${escHtml(instanceId)}">● Checking health...</span>
                <span class="metric-refresh-text" onclick="fetchInstanceMetrics('${escHtml(instanceId)}')" title="Refresh metrics">↺ Refresh</span>
              </div>
            </div>` : ""}
            <div class="app-card-footer">
              ${url ? `<a class="btn btn-ghost btn-sm" href="${url}" target="_blank" rel="noopener noreferrer">Open ↗</a>` : ""}
              ${!isDeleted ? `<button class="btn btn-ghost btn-sm" onclick="downloadSSHKey('${escHtml(appId)}')" title="Download EC2 SSH private key (.pem) to laptop">🔑 SSH Key</button>` : ""}
              <button class="btn btn-ghost btn-sm" onclick="showWebhookModal('${escHtml(appId)}', '${escHtml(repo)}')" title="GitHub Auto-Deploy Webhook">⚡ Webhook</button>
              <button
                class="btn btn-danger btn-sm"
                onclick="terminateApp('${escHtml(instanceId || "")}', this)"
                ${canTerminate ? "" : "disabled"}
                title="${canTerminate ? "Terminate EC2 instance" : "Already terminated"}">
                ${isDeleted ? "Terminated" : "Terminate"}
              </button>
            </div>
          </div>`;
        }).join("");

        setTimeout(loadAllInstanceMetrics, 80);

      } catch (err) {
        document.getElementById("app_count_label").textContent = "Failed to load";
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <div class="empty-state-icon">⚠️</div>
            <h3>Could not load deployments</h3>
            <p>${err.message || "Network error: check your connection."}</p>
            <button class="btn btn-ghost" onclick="loadApps()" style="margin-top:8px;">Try again</button>
          </div>`;
        showToast("Failed to load apps: " + (err.message || "unknown error"), "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "↺ Refresh";
      }
    }

    // ── Terminate EC2 Instance (Validated Ownership + Encrypted Vault) ─
    async function terminateApp(instanceId, btnEl) {
      if (!instanceId || !instanceId.startsWith("i-")) {
        showToast("Invalid instance ID.", "error");
        return;
      }

      const confirmed = confirm(`Terminate instance ${instanceId}?\n\nThis will safely stop and delete the EC2 instance using your vault credentials. This action cannot be undone.`);
      if (!confirmed) return;

      btnEl.disabled = true;
      btnEl.textContent = "Terminating…";

      try {
        const res = await fetchWithAuth("/delete/" + encodeURIComponent(instanceId), {
          method: "DELETE",
        });
        const data = await res.json();

        if (!res.ok) {
          if (res.status === 400 && data.detail && data.detail.includes("credentials")) {
            showToast("AWS credentials required to terminate. Please configure your vault.", "error");
            openVaultModal();
          } else {
            showToast(data.detail || "Terminate failed.", "error");
          }
          btnEl.disabled = false;
          btnEl.textContent = "Terminate";
          return;
        }

        showToast(data.message || `Instance ${instanceId} termination initiated.`, "success");
        setTimeout(loadApps, 1000);

      } catch (err) {
        showToast("Error terminating instance: " + (err.message || "network error"), "error");
        btnEl.disabled = false;
        btnEl.textContent = "Terminate";
      }
    }

    // ── Git Push Webhook Modal Helper ──────────────────────────────
    function showWebhookModal(appId, repo) {
      const webhookUrl = `${window.location.origin}/api/webhooks/github/${appId}`;

      let modal = document.getElementById("adops_webhook_modal");
      if (!modal) {
        const modalHtml = `
        <div id="adops_webhook_modal" class="modal-backdrop" style="display:none;">
          <div class="modal-box" style="max-width:540px;">
            <div class="modal-header">
              <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:1.3rem;">⚡</span>
                <div>
                  <div style="font-size:1.05rem;font-weight:700;color:var(--ink);">GitHub Auto-Deploy Webhook</div>
                  <div style="font-size:0.78rem;color:var(--ink-3);">Automatically redeploys your app on every git push</div>
                </div>
              </div>
              <button type="button" class="btn btn-ghost btn-sm" onclick="closeWebhookModal()" style="padding:4px 8px;">✕</button>
            </div>

            <div style="margin-bottom:16px;">
              <label style="font-size:0.78rem;font-weight:600;color:var(--ink-2);margin-bottom:6px;display:block;">Payload URL</label>
              <div style="display:flex;gap:8px;">
                <input id="webhook_url_input" type="text" readonly style="font-family:var(--font-mono);font-size:0.8rem;background:var(--bg-elevated);color:var(--purple);border:1px solid var(--border);" value="">
                <button type="button" class="btn btn-primary btn-sm" onclick="copyWebhookUrl()" id="copy_webhook_btn">Copy URL</button>
              </div>
            </div>

            <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;font-size:0.8rem;color:var(--ink-2);line-height:1.5;margin-bottom:18px;">
              <div style="font-weight:700;color:var(--ink);margin-bottom:6px;">GitHub Setup Instructions:</div>
              <ol style="padding-left:18px;display:flex;flex-direction:column;gap:5px;">
                <li>Open your GitHub repository &rarr; <strong>Settings</strong> &rarr; <strong>Webhooks</strong> &rarr; <strong>Add Webhook</strong>.</li>
                <li>Paste the URL above into <strong>Payload URL</strong>.</li>
                <li>Set <strong>Content type</strong> to <code>application/json</code>.</li>
                <li>Under &ldquo;Which events would you like to trigger this webhook?&rdquo;, select <strong>Just the push event</strong>.</li>
                <li>Click <strong>Add webhook</strong> : AutoDevOps will now redeploy your EC2 instance automatically whenever you git push!</li>
              </ol>
            </div>

            <div style="display:flex;justify-content:flex-end;">
              <button type="button" class="btn btn-ghost" onclick="closeWebhookModal()">Close</button>
            </div>
          </div>
        </div>
        `;
        document.body.insertAdjacentHTML("beforeend", modalHtml);
        modal = document.getElementById("adops_webhook_modal");
        modal.addEventListener("click", function(e) {
          if (e.target === this) closeWebhookModal();
        });
      }

      document.getElementById("webhook_url_input").value = webhookUrl;
      modal.style.display = "flex";
    }

    function closeWebhookModal() {
      const modal = document.getElementById("adops_webhook_modal");
      if (modal) modal.style.display = "none";
    }

    function copyWebhookUrl() {
      const input = document.getElementById("webhook_url_input");
      if (!input) return;
      input.select();
      navigator.clipboard.writeText(input.value);
      const btn = document.getElementById("copy_webhook_btn");
      if (btn) btn.textContent = "Copied! ✓";
      showToast("Webhook URL copied to clipboard!", "success");
      setTimeout(() => {
        if (btn) btn.textContent = "Copy URL";
      }, 2000);
    }

    // ── Live EC2 Resource Metrics Engine ───────────────────────────
    function buildSparklineSvg(series, strokeColor) {
      if (!series || series.length < 2) return "";
      const width = 80;
      const height = 22;
      const minVal = Math.min(...series);
      const maxVal = Math.max(...series);
      const range = (maxVal - minVal) === 0 ? 1 : (maxVal - minVal);

      const points = series.map((val, idx) => {
        const x = Math.round((idx / (series.length - 1)) * width);
        const y = Math.round(height - 2 - ((val - minVal) / range) * (height - 6));
        return `${x},${y}`;
      });

      const polylinePoints = points.join(" ");
      const polygonPoints = `0,${height} ${polylinePoints} ${width},${height}`;
      const gradId = "grad_" + strokeColor.replace("#", "") + "_" + Math.floor(Math.random() * 1000);

      return `
        <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
          <defs>
            <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <polygon points="${polygonPoints}" fill="url(#${gradId})"/>
          <polyline points="${polylinePoints}" fill="none" stroke="${strokeColor}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `;
    }

    async function fetchInstanceMetrics(instanceId) {
      if (!instanceId || !instanceId.startsWith("i-")) return;
      try {
        const res = await fetchWithAuth(`/api/metrics/${encodeURIComponent(instanceId)}`);
        if (!res.ok) return;
        const m = await res.json();

        const cpuValEl = document.getElementById(`cpu_val_${instanceId}`);
        const ramValEl = document.getElementById(`ram_val_${instanceId}`);
        const netValEl = document.getElementById(`net_val_${instanceId}`);
        const healthEl = document.getElementById(`health_${instanceId}`);
        const cpuChartEl = document.getElementById(`cpu_chart_${instanceId}`);
        const ramChartEl = document.getElementById(`ram_chart_${instanceId}`);
        const netChartEl = document.getElementById(`net_chart_${instanceId}`);

        if (cpuValEl) cpuValEl.textContent = `${m.cpu_percent}%`;
        if (ramValEl) ramValEl.textContent = `${m.ram_percent}%`;
        if (netValEl) netValEl.textContent = `${m.net_in_kb} KB/s`;

        if (healthEl) {
          if (m.status === "healthy") {
            healthEl.className = "metric-health-badge";
            healthEl.innerHTML = `● 2/2 Health Passed`;
          } else {
            healthEl.className = "metric-health-badge initializing";
            healthEl.innerHTML = `○ Initializing status`;
          }
        }

        if (cpuChartEl && m.sparklines && m.sparklines.cpu) {
          cpuChartEl.innerHTML = buildSparklineSvg(m.sparklines.cpu, "#8b5cf6");
        }
        if (ramChartEl && m.sparklines && m.sparklines.ram) {
          ramChartEl.innerHTML = buildSparklineSvg(m.sparklines.ram, "#06b6d4");
        }
        if (netChartEl && m.sparklines && m.sparklines.network) {
          netChartEl.innerHTML = buildSparklineSvg(m.sparklines.network, "#22c55e");
        }
      } catch (_) {
        // Silently skip if network error
      }
    }

    function loadAllInstanceMetrics() {
      const metricPanels = document.querySelectorAll("[id^='metrics_panel_']");
      metricPanels.forEach(panel => {
        const instanceId = panel.id.replace("metrics_panel_", "");
        if (instanceId) {
          fetchInstanceMetrics(instanceId);
        }
      });
    }

    // ── Initialize Dashboard with Auth Guard ────────────────────────
    async function bootDashboard() {
      // 1. Guard route: redirect if not logged in
      const user = await requireAuth("/login?redirect=/dashboard");
      if (!user) return;

      // 2. Render user pill in navbar
      renderNavbarAuth();

      // 3. Vault toolbar update
      await updateVaultToolbar();

      // 4. Load authenticated user's apps
      await loadApps();

      // 5. Listen to vault updates
      window.addEventListener("adops-vault-updated", () => {
        updateVaultToolbar();
      });

      // 6. Polling for live resource metrics every 20s
      setInterval(loadAllInstanceMetrics, 20000);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", bootDashboard);
    } else {
      bootDashboard();
    }
  </script>
</body>
